<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 120" role="img" aria-label="A bucket of baseballs plus Venmo">
	<!-- Ball bucket: five balls, $25 on the side -->
	<defs>
		<g id="ball">
			<circle r="13" fill="#fff" stroke="#c9c9c9" stroke-width="1" />
			<path d="M-7 -10 Q-2 0 -7 10" fill="none" stroke="#cd163f" stroke-width="1.4" stroke-dasharray="2 2" />
			<path d="M7 -10 Q2 0 7 10" fill="none" stroke="#cd163f" stroke-width="1.4" stroke-dasharray="2 2" />
		</g>
	</defs>
	<use href="#ball" x="30" y="30" />
	<use href="#ball" x="54" y="24" />
	<use href="#ball" x="78" y="30" />
	<use href="#ball" x="42" y="38" />
	<use href="#ball" x="66" y="38" />
	<path d="M20 22 Q54 -6 88 22" fill="none" stroke="#555" stroke-width="2.5" />
	<path d="M14 40 L94 40 L86 114 L22 114 Z" fill="#1a1a1a" />
	<rect x="11" y="38" width="86" height="8" rx="3" fill="#2b2b2b" />
	<rect x="17" y="58" width="74" height="3" fill="#2b2b2b" />
	<text x="54" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#fff">$25</text>
	<!-- Plus -->
	<path d="M124 66 h22 M135 55 v22" stroke="#333" stroke-width="5" stroke-linecap="round" />
	<!-- Venmo app icon -->
	<rect x="170" y="30" width="76" height="76" rx="18" fill="#008cff" />
	<path d="M224 46 c3 5 4 10 4 16 c0 18 -15 34 -27 34 h-13 l-9 -48 l15 -2 l5 37 c5 -8 11 -20 11 -29 c0 -5 -1 -8 -2 -11 z" fill="#fff" />
</svg>
